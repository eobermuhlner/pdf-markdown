name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

env:
  JDK_VERSION: "11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Build fat JAR
        run: bash ./gradlew build -Pversion=${{ env.VERSION }}

      - name: Build sources and javadoc
        run: bash ./gradlew sourcesJar javadocJar -Pversion=${{ env.VERSION }}

      - name: Build install distribution
        run: bash ./gradlew installDistZip -Pversion=${{ env.VERSION }}

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/libs/pdf-markdown-*.jar
            build/libs/pdf-markdown-*-sources.jar
            build/libs/pdf-markdown-*-javadoc.jar
            build/distributions/pdf-markdown-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Rename install distribution
        run: |
          cd release
          mv pdf-markdown-*.zip pdf-markdown-${{ env.VERSION }}-linux.zip || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}