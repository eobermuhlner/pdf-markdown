name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

env:
  JDK_VERSION: "11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Build and create distributions
        run: |
          bash ./gradlew jar sourcesJar javadocJar distZip -Pversion=${{ env.VERSION }}

      - name: Upload thin JAR
        uses: actions/upload-artifact@v4
        with:
          name: thin-jar
          path: build/libs/pdf-markdown-*.jar

      - name: Upload sources JAR
        uses: actions/upload-artifact@v4
        with:
          name: sources-jar
          path: build/libs/pdf-markdown-*-sources.jar

      - name: Upload javadoc JAR
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-jar
          path: build/libs/pdf-markdown-*-javadoc.jar

      - name: Upload distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cli-zip
          path: build/distributions/pdf-markdown-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download thin JAR
        uses: actions/download-artifact@v4
        with:
          name: thin-jar
          path: release/

      - name: Download sources JAR
        uses: actions/download-artifact@v4
        with:
          name: sources-jar
          path: release/

      - name: Download javadoc JAR
        uses: actions/download-artifact@v4
        with:
          name: javadoc-jar
          path: release/

      - name: Download CLI ZIP
        uses: actions/download-artifact@v4
        with:
          name: cli-zip
          path: release/

      - name: Rename artifacts
        run: |
          cd release
          VERSION="${GITHUB_REF_NAME#v}"
          # CLI distribution
          mv pdf-markdown-*.zip "pdf-markdown-${VERSION}.zip"
          # Thin JAR (ensure correct name)
          for f in pdf-markdown-$VERSION.jar; do [ -f "$f" ] && mv "$f" "pdf-markdown-${VERSION}.jar" || true; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: "Release ${{ github.ref_name }}"
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}