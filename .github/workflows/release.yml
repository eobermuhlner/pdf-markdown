name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

env:
  JDK_VERSION: "11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Build fat JAR
        run: bash ./gradlew build -Pversion=${{ env.VERSION }}

      - name: Build sources and javadoc
        run: bash ./gradlew sourcesJar javadocJar -Pversion=${{ env.VERSION }}

      - name: Build install distribution
        run: bash ./gradlew distZip -Pversion=${{ env.VERSION }}

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: build/libs/pdf-markdown-*.jar

      - name: Upload sources JAR
        uses: actions/upload-artifact@v4
        with:
          name: sources-jar
          path: build/libs/pdf-markdown-*-sources.jar

      - name: Upload javadoc JAR
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-jar
          path: build/libs/pdf-markdown-*-javadoc.jar

      - name: Upload distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: build/distributions/pdf-markdown-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download fat JAR
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: release/

      - name: Download sources JAR
        uses: actions/download-artifact@v4
        with:
          name: sources-jar
          path: release/

      - name: Download javadoc JAR
        uses: actions/download-artifact@v4
        with:
          name: javadoc-jar
          path: release/

      - name: Download distribution ZIP
        uses: actions/download-artifact@v4
        with:
          name: dist-zip
          path: release/

      - name: Rename distribution
        run: |
          cd release
          VERSION="${GITHUB_REF_NAME#v}"
          mv pdf-markdown-*.zip "pdf-markdown-${VERSION}-linux.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: "Release ${{ github.ref_name }}"
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}